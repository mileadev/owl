name: Validate
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install python-dotenv
      - name: Compile source
        run: python -m compileall -q owl examples tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: English-only gate
        run: python scripts/check_english.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -f .container/Dockerfile .
