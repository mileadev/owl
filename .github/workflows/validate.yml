name: Validate
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and security tooling
        run: python -m pip install -e . bandit pip-audit
      - name: Compile source
        run: python -m compileall -q owl examples tests scripts community_usecase
      - name: Unit tests and mocked HTTP integration
        run: python -m unittest discover -s tests -v
      - name: English-only gate
        run: python scripts/check_english.py
      - name: Tracked secrets gate
        run: python scripts/check_secrets.py
      - name: Static security scan of main package
        run: bandit -q -r owl -ll -iii
      - name: Dependency vulnerability audit
        run: python -m pip_audit --progress-spinner off
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t owl-ci -f .container/Dockerfile .
      - name: Smoke-test UI startup in restricted container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f owl-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name owl-ci --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:7860:7860 \
            -e HOME=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e GRADIO_ANALYTICS_ENABLED=False \
            -e GRADIO_SERVER_NAME=0.0.0.0 owl-ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null; then
              echo "OWL UI smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs owl-ci
          exit 1
