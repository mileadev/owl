repos:
  - repo: local
    hooks:
      - id: english-only
        name: English-only tracked sources
        entry: python scripts/check_english.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-secrets
        name: Check for tracked secrets
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: OWL unit tests
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        always_run: true
