services:
  owl:
    build:
      context: ..
      dockerfile: .container/Dockerfile
    env_file:
      - ../.env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OWL_SERVER_HOST: 0.0.0.0
      OWL_SERVER_PORT: "7860"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      HF_HOME: /tmp/hf
      OWL_ALLOW_NON_LOOPBACK: I_UNDERSTAND_THE_RISK
    ports:
      - "127.0.0.1:7860:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    user: "10001:10001"
    init: true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
